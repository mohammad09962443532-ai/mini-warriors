














name: Build Mini Warriors APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip openjdk-17-jdk

      - name: Download Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -O godot.zip
          unzip -q godot.zip -d godot
          chmod +x godot/Godot_v4.3-stable_linux.x86_64

      - name: Download Android export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -O templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          unzip -q templates.tpz -d templates
          cp templates/templates/android_debug.apk ~/.local/share/godot/export_templates/4.3.stable/
          cp templates/templates/android_release.apk ~/.local/share/godot/export_templates/4.3.stable/

      - name: Find project
        run: |
          PROJECT_FILE=$(find . -name project.godot -not -path './godot/*' -print -quit)
          test -n "$PROJECT_FILE"
          echo "PROJECT_DIR=$(dirname "$PROJECT_FILE")" >> "$GITHUB_ENV"

      - name: Import project
        run: |
          ./godot/Godot_v4.3-stable_linux.x86_64 --headless --editor --path "$PROJECT_DIR" --quit

      - name: Upload project for inspection
        uses: actions/upload-artifact@v4
        with:
          name: MiniWarriors-Project
          path: |
            ${{ env.PROJECT_DIR }}/
