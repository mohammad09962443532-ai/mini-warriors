name: Build Mini Warriors APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MiniWarriors_Godot_Starter.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wget openjdk-17-jdk

      - name: Download Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -O godot.zip
          unzip -q godot.zip -d godot
          chmod +x godot/Godot_v4.3-stable_linux.x86_64

      - name: Extract project
        run: |
          unzip -q MiniWarriors_Godot_Starter.zip -d project
          find project -name project.godot

      - name: Check project
        run: |
          PROJECT_FILE=$(find project -name project.godot -print -quit)
          test -n "$PROJECT_FILE"
          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          ./godot/Godot_v4.3-stable_linux.x86_64 --headless --path "$PROJECT_DIR" --editor --quit

      - name: Upload project
        uses: actions/upload-artifact@v4
        with:
          name: MiniWarriors-Project
          path: project/
